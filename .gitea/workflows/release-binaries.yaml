name: Build Release Binaries

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths:
      - 'cmd/**'
      - '.gitea/workflows/release-binaries.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_extension: tar.gz
            artifact_suffix: linux-amd64
          - goos: linux
            goarch: arm64
            archive_extension: tar.gz
            artifact_suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            archive_extension: tar.gz
            artifact_suffix: linux-armv7
          - goos: darwin
            goarch: amd64
            archive_extension: tar.gz
            artifact_suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            archive_extension: tar.gz
            artifact_suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            archive_extension: zip
            artifact_suffix: windows-amd64
          - goos: windows
            goarch: arm64
            archive_extension: zip
            artifact_suffix: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: cmd/go.sum

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail

          APP_NAME="picoblog"
          SUFFIX="${ARTIFACT_SUFFIX}"
          ROOT_DIR="$(pwd)"
          DIST_DIR="${ROOT_DIR}/dist"
          STAGING_DIR="${DIST_DIR}/${APP_NAME}-${SUFFIX}"
          BINARY_NAME="${APP_NAME}"

          if [ "${GOOS}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          mkdir -p "${STAGING_DIR}"

          VERSION="${VERSION:-dev}"
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct 2>/dev/null || date +%s)

          cd cmd/

          if [ -n "${GOARM:-}" ]; then
            export GOARM
          else
            unset GOARM || true
          fi

          GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 \
            go build -trimpath -buildvcs=false -ldflags "-s -w -X main.Version=${VERSION}" -o "${STAGING_DIR}/${BINARY_NAME}" .

          if [ "${GOOS}" = "windows" ]; then
            ARCHIVE_PATH="${DIST_DIR}/${APP_NAME}-${SUFFIX}.zip"
            (cd "${STAGING_DIR}" && TZ=UTC zip -X -r "${ARCHIVE_PATH}" "${BINARY_NAME}")
          else
            ARCHIVE_PATH="${DIST_DIR}/${APP_NAME}-${SUFFIX}.tar.gz"
            (cd "${STAGING_DIR}" && tar --mtime="@${SOURCE_DATE_EPOCH}" -czf "${ARCHIVE_PATH}" "${BINARY_NAME}")
          fi

          rm -rf "${STAGING_DIR}"

      - name: Generate SHA256 checksum
        run: |
          cd dist
          ARCHIVE_FILE="picoblog-${{ matrix.artifact_suffix }}.${{ matrix.archive_extension }}"
          sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          echo "Generated checksum for ${ARCHIVE_FILE}:"
          cat "${ARCHIVE_FILE}.sha256"

      - name: Upload artifact with checksum
        uses: actions/upload-artifact@v3
        with:
          name: picoblog-${{ matrix.artifact_suffix }}.zip
          path: |
            dist/picoblog-${{ matrix.artifact_suffix }}.${{ matrix.archive_extension }}
            dist/picoblog-${{ matrix.artifact_suffix }}.${{ matrix.archive_extension }}.sha256
          retention-days: 1

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TOKEN: ${{ secrets.USER_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail

          files="
          dist/picoblog-${{ matrix.artifact_suffix }}.${{ matrix.archive_extension }}
          dist/picoblog-${{ matrix.artifact_suffix }}.${{ matrix.archive_extension }}.sha256
          "

          api="${GITHUB_SERVER_URL}/api/v1"
          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          auth_header="Authorization: token ${RELEASE_TOKEN}"

          release_json="$(mktemp)"
          status=$(curl -sS -w "%{http_code}" -o "$release_json" \
            -H "$auth_header" \
            "${api}/repos/${repo}/releases/tags/${tag}" || true)

          if [ "$status" = "404" ]; then
            payload="$(mktemp)"
            TAG="$tag" PRERELEASE="$PRERELEASE" python3 - <<'PY' > "$payload"
          import json
          import os

          tag = os.environ["TAG"]
          prerelease = os.environ["PRERELEASE"].lower() == "true"
          print(json.dumps({
              "tag_name": tag,
              "name": tag,
              "body": "",
              "draft": False,
              "prerelease": prerelease,
          }))
          PY
            status=$(curl -sS -w "%{http_code}" -o "$release_json" \
              -X POST \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              --data @"$payload" \
              "${api}/repos/${repo}/releases" || true)
            rm -f "$payload"

            if [ "$status" != "201" ]; then
              status=$(curl -sS -w "%{http_code}" -o "$release_json" \
                -H "$auth_header" \
                "${api}/repos/${repo}/releases/tags/${tag}" || true)
            fi
          fi

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Failed to create or fetch release for ${tag}; HTTP ${status}"
            cat "$release_json"
            exit 1
          fi

          release_id=$(python3 - "$release_json" <<'PY'
          import json
          import sys

          print(json.load(open(sys.argv[1]))["id"])
          PY
          )

          assets_json="$(mktemp)"
          curl -sS -f -o "$assets_json" \
            -H "$auth_header" \
            "${api}/repos/${repo}/releases/${release_id}/assets"

          for file in $files; do
            name="$(basename "$file")"
            existing_id=$(ASSET_NAME="$name" python3 - "$assets_json" <<'PY'
          import json
          import os
          import sys

          target = os.environ["ASSET_NAME"]
          for asset in json.load(open(sys.argv[1])):
              if asset.get("name") == target:
                  print(asset["id"])
                  break
          PY
            )

            if [ -n "$existing_id" ]; then
              curl -sS -f -X DELETE \
                -H "$auth_header" \
                "${api}/repos/${repo}/releases/${release_id}/assets/${existing_id}"
            fi

            curl -sS -f -X POST \
              -H "$auth_header" \
              -F "attachment=@${file}" \
              "${api}/repos/${repo}/releases/${release_id}/assets?name=${name}"
          done

          rm -f "$release_json" "$assets_json"

  checksums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create combined SHA256SUMS file
        run: |
          echo "Creating combined SHA256SUMS file..."
          cd artifacts
          find . -name "*.sha256" -exec cat {} \; | sort > ../SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat ../SHA256SUMS

      - name: Upload SHA256SUMS to release
        env:
          RELEASE_TOKEN: ${{ secrets.USER_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail

          api="${GITHUB_SERVER_URL}/api/v1"
          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          auth_header="Authorization: token ${RELEASE_TOKEN}"

          release_json="$(mktemp)"
          status=$(curl -sS -w "%{http_code}" -o "$release_json" \
            -H "$auth_header" \
            "${api}/repos/${repo}/releases/tags/${tag}" || true)

          if [ "$status" = "404" ]; then
            payload="$(mktemp)"
            TAG="$tag" PRERELEASE="$PRERELEASE" python3 - <<'PY' > "$payload"
          import json
          import os

          tag = os.environ["TAG"]
          prerelease = os.environ["PRERELEASE"].lower() == "true"
          print(json.dumps({
              "tag_name": tag,
              "name": tag,
              "body": "",
              "draft": False,
              "prerelease": prerelease,
          }))
          PY
            status=$(curl -sS -w "%{http_code}" -o "$release_json" \
              -X POST \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              --data @"$payload" \
              "${api}/repos/${repo}/releases" || true)
            rm -f "$payload"

            if [ "$status" != "201" ]; then
              status=$(curl -sS -w "%{http_code}" -o "$release_json" \
                -H "$auth_header" \
                "${api}/repos/${repo}/releases/tags/${tag}" || true)
            fi
          fi

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Failed to create or fetch release for ${tag}; HTTP ${status}"
            cat "$release_json"
            exit 1
          fi

          release_id=$(python3 - "$release_json" <<'PY'
          import json
          import sys

          print(json.load(open(sys.argv[1]))["id"])
          PY
          )

          assets_json="$(mktemp)"
          curl -sS -f -o "$assets_json" \
            -H "$auth_header" \
            "${api}/repos/${repo}/releases/${release_id}/assets"

          existing_id=$(python3 - "$assets_json" <<'PY'
          import json
          import sys

          for asset in json.load(open(sys.argv[1])):
              if asset.get("name") == "SHA256SUMS":
                  print(asset["id"])
                  break
          PY
          )

          if [ -n "$existing_id" ]; then
            curl -sS -f -X DELETE \
              -H "$auth_header" \
              "${api}/repos/${repo}/releases/${release_id}/assets/${existing_id}"
          fi

          curl -sS -f -X POST \
            -H "$auth_header" \
            -F "attachment=@SHA256SUMS" \
            "${api}/repos/${repo}/releases/${release_id}/assets?name=SHA256SUMS"

          rm -f "$release_json" "$assets_json"
